<search tuiSearch>
  <form>
    <fieldset tuiTextfieldSize="s">
      <tui-textfield iconStart="@tui.search">
        <input
          [ngModel]="search()"
          (ngModelChange)="searchChange($event)"
          name="search"
          placeholder="Search"
          tuiTextfield
        />
      </tui-textfield>
    </fieldset>
  </form>
</search>
<div>
  @for (user of users | async; track $index) {
    <div class="user" tuiCell="s">
      <button tuiButton appearance="flat-grayscale" type="button" (click)="setReceiver(user)">
        <span>{{ user.login }}</span>
        <span
          [tuiStatus]="user.isOnline ? 'var(--tui-status-positive)' : 'var(--tui-status-neutral)'"
        ></span>
      </button>
    </div>
  }
</div>
